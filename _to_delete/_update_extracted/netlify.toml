[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# El plugin oficial de Next.js para Netlify traduce automáticamente Server
# Actions, Route Handlers, middleware/proxy e ISR a Netlify Functions/Edge
# Functions — no hace falta configuración adicional de redirects.
#
# Cron Jobs (Netlify Scheduled Functions): netlify/functions/*.ts con un
# `export const config = { schedule: "..." }` se despliegan solas al hacer
# push — no requieren nada más acá. Ver README.md § Cron Jobs.
#   - notify-upcoming-publishes: cada 15 min, avisa 30 min antes de publicar.
#   - notify-delinquent-invoices: una vez por día, recordatorios de pago y
#     alerta de morosidad 15d+.
